components:
  schemas:
    AdminDashboardSummary:
      type: object
      properties:
        total_students:
          type: integer
        total_mentors:
          type: integer
        total_admins:
          type: integer
        active_courses:
          type: integer
        internship_batches:
          type: integer
      required:
      - active_courses
      - internship_batches
      - total_admins
      - total_mentors
      - total_students
    AdminLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    AdminLoginResponse:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
        user:
          $ref: '#/components/schemas/AdminLoginUser'
      required:
      - access
      - refresh
      - user
    AdminLoginUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        first_name:
          type: string
        last_name:
          type: string
