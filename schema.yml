openapi: 3.0.3
info:
  title: RaushByte LMS API
  version: 1.0.0
  description: "\n    API documentation for the RaushByte Learning\n    Management
    System.\n\n    This API provides endpoints for:\n    - User authentication\n    -
    User management\n    - Course management\n    - Modules and lessons\n    - Student
    enrollment\n    - Assessments\n    - Progress tracking\n    "
paths:
  /api/v1/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      summary: Get the admin dashboard summary
      tags:
      - Administration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardSummary'
          description: ''
        '403':
          description: Administrator access required
  /api/v1/admin/login/:
    post:
      operationId: admin_login_create
      description: Authenticates an administrator and returns JWT tokens and profile
        details.
      summary: Log in an administrator
      tags:
      - Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLogin'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
          description: ''
        '400':
          description: Invalid login details
        '401':
          description: Invalid email or password
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      summary: List users
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
        '403':
          description: Administrator access required
    post:
      operationId: admin_users_create
      summary: Create a user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Invalid user details
        '403':
          description: Administrator access required
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      summary: Get a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '403':
          description: Administrator access required
        '404':
          description: User not found
    put:
      operationId: admin_users_update
      summary: Replace a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Invalid user details
        '403':
          description: Administrator access required
        '404':
          description: User not found
    patch:
      operationId: admin_users_partial_update
      summary: Update a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Invalid user details
        '403':
          description: Administrator access required
        '404':
          description: User not found
    delete:
      operationId: admin_users_destroy
      summary: Delete a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Administrator access required
        '404':
          description: User not found
  /api/v1/auth/login/:
